version: "3.5"

services:
  # -------- Milvus 依赖栈（带数据 bind mount）--------
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  # -------- Python Agent：使用"已构建好的镜像"（服务器无需源码/无需 build）--------
  agent:
    container_name: picture-agent-backend
    image: ${AGENT_IMAGE:-picture-agent-backend:1.0}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 离线部署：把 embedding 模型目录放到宿主机 ./models，然后挂载进容器，避免启动时访问 huggingface.co
      # 目录结构示例：./models/paraphrase-multilingual-MiniLM-L12-v2/**（config.json, tokenizer.json, model.safetensors 等）
      - ${DOCKER_VOLUME_DIRECTORY:-.}/models:/models:ro
    environment:
      JAVA_BASE_URL: ${JAVA_BASE_URL:-http://host.docker.internal:8123/api}
      MILVUS_URI: ${MILVUS_URI:-http://standalone:19530}
      # 文本向量模型：建议指向容器内本地路径（避免拉 HuggingFace）
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-/models/paraphrase-multilingual-MiniLM-L12-v2}
      # 强制离线（可选）：避免 sentence-transformers/transformers 试图联网
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-meizijun}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meizijun_mima_123}
      MYSQL_DB: ${MYSQL_DB:-yu_picture}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
    ports:
      - "9002:9002"
    depends_on:
      - standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: milvus


