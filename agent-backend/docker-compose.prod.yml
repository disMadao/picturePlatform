version: "3.5"

services:
  # -------- Milvus 依赖栈（带数据 bind mount）--------
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    # 生产环境：advertise 需要能被其他容器访问（不要用 127.0.0.1）
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  # -------- Python Agent（对外只需要暴露它）--------
  agent:
    container_name: picture-agent-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Linux 环境默认没有 host.docker.internal：加这个映射后，你可以继续在 .env 里用 host.docker.internal 指向宿主机的 Java/MySQL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Java 后端地址（直接访问 SpringBoot 8123 端口）
      JAVA_BASE_URL: ${JAVA_BASE_URL:-http://host.docker.internal:8123/api}

      # Milvus：容器内访问用 service name
      MILVUS_URI: ${MILVUS_URI:-http://standalone:19530}

      # 可选：用于更精细路由决策
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}

      # 记录 agent 搜索历史需要 MySQL（与 Java 后端同库）
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-meizijun}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meizijun_mima_123}
      MYSQL_DB: ${MYSQL_DB:-yu_picture}

      # 可选：与 Java 后端的内部鉴权（推荐）
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
    ports:
      - "9002:9002"
    depends_on:
      - standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: milvus


