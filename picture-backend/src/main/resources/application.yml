server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: picture-backend
  profiles:
    active: local  # 改为生产环境



  # Session 配置
  session:
    store-type: redis
    # session 30 天后过期
    timeout: 2592000
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB


# Agent 内部鉴权（避免在 Agent 中保存管理员账号密码）
agent:
  # Python Agent 请求头：X-Internal-Token
  # 建议从环境变量注入：AGENT_INTERNAL_TOKEN
  internalToken: ${AGENT_INTERNAL_TOKEN:}
  # 可选：指定一个管理员 userId；不填则自动找一个 admin 账号
  adminUserId: 123123123
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 仅在开发环境打印日志
    log-impl: ''
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
