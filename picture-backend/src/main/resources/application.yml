# WebSocket 协同编辑跨实例广播方式：
# - redis：Redis Pub/Sub（默认，轻量但订阅端断线可能丢消息）
# - mq：RabbitMQ fanout（更可靠，支持 ack/retry；需要部署 RabbitMQ）
pictureEdit:
  broadcast: redis